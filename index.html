<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japanese Study Guide | JLPT N5 - N1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        bgLight: '#f8fafc',
                        cardWhite: '#ffffff',
                        primary: '#4f46e5', /* Indigo 600 */
                        primaryHover: '#4338ca', /* Indigo 700 */
                        textMain: '#1e293b', /* Slate 800 */
                        textMuted: '#64748b', /* Slate 500 */
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        jp: ['"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- FLASHCARDS --- */
        .flashcard {
            background: #ffffff;
            border-radius: 16px;
            aspect-ratio: 1 / 1.1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            cursor: pointer;
        }

        .flashcard:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border-color: #c7d2fe;
        }

        .play-btn {
            background: #f1f5f9;
            color: #64748b;
            transition: all 0.2s;
        }
        
        .play-btn:hover {
            background: #e0e7ff;
            color: #4f46e5;
            transform: scale(1.1);
        }

        /* --- MODAL POPUP --- */
        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            z-index: 5000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .btn-reveal {
            background: #4f46e5;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .btn-reveal:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .filter-btn.active {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

    <header class="pt-12 md:pt-20 pb-4 text-center px-6 relative z-40 max-w-5xl mx-auto">
        <div class="inline-block mb-3">
            <i data-lucide="book-open" class="text-primary w-8 h-8"></i>
        </div>
        <h1 class="font-sans font-bold text-3xl md:text-5xl text-textMain mb-3 tracking-tight">
            Nihongo Study Guide
        </h1>
        <p class="font-sans text-textMuted text-sm md:text-base mb-8">Master Japanese vocabulary from Daily Basics to JLPT N1.</p>

        <div class="flex justify-center gap-2 md:gap-3 flex-wrap">
            <button class="filter-btn active px-4 py-2 rounded-lg font-medium text-sm border border-gray-300 bg-white text-gray-600 transition-colors hover:bg-gray-50" data-filter="all">All Words</button>
            <button class="filter-btn px-4 py-2 rounded-lg font-medium text-sm border border-gray-300 bg-white text-gray-600 transition-colors hover:bg-gray-50" data-filter="daily">Daily / Basics</button>
            <button class="filter-btn px-4 py-2 rounded-lg font-medium text-sm border border-gray-300 bg-white text-gray-600 transition-colors hover:bg-gray-50" data-filter="N5">JLPT N5</button>
            <button class="filter-btn px-4 py-2 rounded-lg font-medium text-sm border border-gray-300 bg-white text-gray-600 transition-colors hover:bg-gray-50" data-filter="N4">JLPT N4</button>
            <button class="filter-btn px-4 py-2 rounded-lg font-medium text-sm border border-gray-300 bg-white text-gray-600 transition-colors hover:bg-gray-50" data-filter="N3">JLPT N3</button>
            <button class="filter-btn px-4 py-2 rounded-lg font-medium text-sm border border-gray-300 bg-white text-gray-600 transition-colors hover:bg-gray-50" data-filter="N2">JLPT N2</button>
            <button class="filter-btn px-4 py-2 rounded-lg font-medium text-sm border border-gray-300 bg-white text-gray-600 transition-colors hover:bg-gray-50" data-filter="N1">JLPT N1</button>
        </div>

        <div class="relative w-full max-w-xl mx-auto mt-8">
            <div class="relative flex items-center">
                <i data-lucide="search" class="absolute left-4 w-5 h-5 text-gray-400"></i>
                <input type="text" id="search-input" placeholder="Search by Kanji, Kana, or English..." 
                       class="w-full py-3 md:py-4 pl-12 pr-6 bg-white border border-gray-300 rounded-xl text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-sm md:text-base shadow-sm">
            </div>
            <ul id="search-dropdown" class="absolute w-full mt-2 bg-white border border-gray-200 rounded-xl shadow-lg overflow-hidden hidden max-h-60 overflow-y-auto z-50 text-left">
            </ul>
        </div>

        <div id="pagination-controls" class="flex justify-center gap-2 mt-8 flex-wrap z-50 relative">
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 px-4 md:px-8 pb-32 mt-6" id="phrase-grid">
    </main>

    <div id="modal-overlay">
        <div class="modal-content" id="modal-card">
            <button id="close-modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition-colors z-10 p-2">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            
            <div id="modal-body" class="relative z-10">
                <span id="modal-category" class="inline-block px-3 py-1 bg-gray-100 text-primary rounded-full text-xs font-bold mb-6 tracking-wide"></span>
                
                <div class="flex flex-col justify-center items-center gap-2 mb-2">
                    <span id="modal-kana" class="text-sm md:text-base text-gray-500 font-jp"></span>
                    <div class="flex items-center gap-3">
                        <h2 id="modal-jp" class="font-jp text-4xl md:text-5xl font-bold text-textMain leading-tight"></h2>
                        <button id="modal-play-btn" class="play-btn rounded-full p-2">
                            <i data-lucide="volume-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
                <p id="modal-romaji" class="text-xs text-gray-400 font-medium tracking-widest mb-8"></p>
                
                <div id="translation-area" class="opacity-0">
                    <div class="w-full h-px bg-gray-200 mx-auto mb-6"></div>
                    <span class="text-[10px] uppercase tracking-widest text-gray-400 mb-2 block font-bold">Meaning</span>
                    <h3 id="modal-en" class="font-sans text-xl md:text-2xl text-gray-800 font-semibold"></h3>
                    <p id="modal-desc" class="text-sm text-gray-500 mt-4 max-w-[90%] mx-auto leading-relaxed bg-gray-50 p-3 rounded-lg hidden"></p>
                </div>

                <div id="action-area" class="mt-8">
                    <button id="reveal-btn" class="btn-reveal">Reveal Meaning</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Audio Function
        function playJapaneseAudio(text, event) {
            if (event) event.stopPropagation(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP'; 
            utterance.rate = 0.85; // Slightly slower for clear study comprehension
            window.speechSynthesis.speak(utterance);
        }

        // --- VOCABULARY DATABASE ---
        // You can easily expand this array to hold thousands of words.
        const studyWords = [
            // DAILY / BASICS
            { jp: "おはよう", kana: "おはよう", romaji: "ohayou", en: "Good morning", category: "daily", desc: "Add 'gozaimasu' (ございます) to be polite." },
            { jp: "ありがとう", kana: "ありがとう", romaji: "arigatou", en: "Thank you", category: "daily" },
            { jp: "すみません", kana: "すみません", romaji: "sumimasen", en: "Excuse me / I'm sorry", category: "daily", desc: "Extremely useful. Used to apologize, get a waiter's attention, or say 'excuse me' when passing by." },
            { jp: "お願いします", kana: "おねがいします", romaji: "onegaishimasu", en: "Please (do this for me)", category: "daily" },
            { jp: "いくらですか", kana: "いくらですか", romaji: "ikura desu ka", en: "How much is this?", category: "daily" },
            { jp: "トイレはどこですか", kana: "トイレはどこですか", romaji: "toire wa doko desu ka", en: "Where is the bathroom?", category: "daily" },
            { jp: "助けて", kana: "たすけて", romaji: "tasukete", en: "Help me", category: "daily" },
            { jp: "わかりません", kana: "わかりません", romaji: "wakarimasen", en: "I don't understand", category: "daily" },
            { jp: "水", kana: "みず", romaji: "mizu", en: "Water", category: "daily" },
            { jp: "大丈夫", kana: "だいじょうぶ", romaji: "daijoubu", en: "It's okay / I'm fine", category: "daily" },

            // N5 (Beginner)
            { jp: "食べる", kana: "たべる", romaji: "taberu", en: "To eat", category: "N5" },
            { jp: "飲む", kana: "のむ", romaji: "nomu", en: "To drink", category: "N5" },
            { jp: "大きい", kana: "おおきい", romaji: "ookii", en: "Big", category: "N5" },
            { jp: "小さい", kana: "ちいさい", romaji: "chiisai", en: "Small", category: "N5" },
            { jp: "行く", kana: "いく", romaji: "iku", en: "To go", category: "N5" },
            { jp: "来る", kana: "くる", romaji: "kuru", en: "To come", category: "N5" },
            { jp: "学校", kana: "がっこう", romaji: "gakkou", en: "School", category: "N5" },
            { jp: "先生", kana: "せんせい", romaji: "sensei", en: "Teacher", category: "N5" },
            { jp: "時間", kana: "じかん", romaji: "jikan", en: "Time", category: "N5" },
            { jp: "昨日", kana: "きのう", romaji: "kinou", en: "Yesterday", category: "N5" },

            // N4 (Upper Beginner)
            { jp: "複雑", kana: "ふくざつ", romaji: "fukuzatsu", en: "Complicated", category: "N4" },
            { jp: "案内", kana: "あんない", romaji: "annai", en: "Guidance / Guide", category: "N4" },
            { jp: "準備", kana: "じゅんび", romaji: "junbi", en: "Preparation", category: "N4" },
            { jp: "払う", kana: "はらう", romaji: "harau", en: "To pay", category: "N4" },
            { jp: "探す", kana: "さがす", romaji: "sagasu", en: "To look for", category: "N4" },
            { jp: "約束", kana: "やくそく", romaji: "yakusoku", en: "Promise / Appointment", category: "N4" },
            { jp: "忙しい", kana: "いそがしい", romaji: "isogashii", en: "Busy", category: "N4" },
            { jp: "経験", kana: "けいけん", romaji: "keiken", en: "Experience", category: "N4" },
            { jp: "理由", kana: "りゆう", romaji: "riyuu", en: "Reason", category: "N4" },
            { jp: "続く", kana: "つづく", romaji: "tsuduku", en: "To continue", category: "N4" },

            // N3 (Intermediate)
            { jp: "政治", kana: "せいじ", romaji: "seiji", en: "Politics", category: "N3" },
            { jp: "影響", kana: "えいきょう", romaji: "eikyou", en: "Influence / Effect", category: "N3" },
            { jp: "責任", kana: "せきにん", romaji: "sekinin", en: "Responsibility", category: "N3" },
            { jp: "確かめる", kana: "たしかめる", romaji: "tashikameru", en: "To confirm / To verify", category: "N3" },
            { jp: "期待", kana: "きたい", romaji: "kitai", en: "Expectation", category: "N3" },
            { jp: "表現", kana: "ひょうげん", romaji: "hyougen", en: "Expression", category: "N3" },
            { jp: "状態", kana: "じょうたい", romaji: "joutai", en: "Condition / State", category: "N3" },
            { jp: "努力", kana: "どりょく", romaji: "doryoku", en: "Effort", category: "N3" },
            { jp: "記事", kana: "きじ", romaji: "kiji", en: "Article (News)", category: "N3" },
            { jp: "解決", kana: "かいけつ", romaji: "kaiketsu", en: "Resolution / Solution", category: "N3" },

            // N2 (Upper Intermediate)
            { jp: "傾向", kana: "けいこう", romaji: "keikou", en: "Trend / Tendency", category: "N2" },
            { jp: "貢献", kana: "こうけん", romaji: "kouken", en: "Contribution", category: "N2" },
            { jp: "深刻", kana: "しんこく", romaji: "shinkoku", en: "Serious / Severe", category: "N2" },
            { jp: "豊富", kana: "ほうふ", romaji: "houfu", en: "Abundant / Wealth", category: "N2" },
            { jp: "徹底", kana: "てってい", romaji: "tettei", en: "Thoroughness", category: "N2" },
            { jp: "矛盾", kana: "むじゅん", romaji: "mujun", en: "Contradiction", category: "N2" },
            { jp: "比較", kana: "ひかく", romaji: "hikaku", en: "Comparison", category: "N2" },
            { jp: "適用", kana: "てきよう", romaji: "tekiyou", en: "Application / Adoption", category: "N2" },
            { jp: "柔軟", kana: "じゅうなん", romaji: "juunan", en: "Flexible", category: "N2" },
            { jp: "偶然", kana: "ぐうぜん", romaji: "guuzen", en: "Coincidence", category: "N2" },

            // N1 (Advanced)
            { jp: "懸念", kana: "けねん", romaji: "kenen", en: "Concern / Anxiety", category: "N1" },
            { jp: "促進", kana: "そくしん", romaji: "sokushin", en: "Promotion / Acceleration", category: "N1" },
            { jp: "妥協", kana: "だきょう", romaji: "dakyou", en: "Compromise", category: "N1" },
            { jp: "錯覚", kana: "さっかく", romaji: "sakkaku", en: "Optical illusion / Hallucination", category: "N1" },
            { jp: "軌道", kana: "きどう", romaji: "kidou", en: "Orbit / Track", category: "N1" },
            { jp: "模索", kana: "もさく", romaji: "mosaku", en: "Groping (for) / Exploring", category: "N1" },
            { jp: "逸脱", kana: "いつだつ", romaji: "itsudatsu", en: "Deviation / Departure", category: "N1" },
            { jp: "巧妙", kana: "こうみょう", romaji: "koumyou", en: "Ingenious / Skillful", category: "N1" },
            { jp: "偏見", kana: "へんけん", romaji: "henken", en: "Prejudice / Bias", category: "N1" },
            { jp: "蓄積", kana: "ちくせき", romaji: "chikuseki", en: "Accumulation", category: "N1" }
        ];

        const grid = document.getElementById('phrase-grid');
        const overlay = document.getElementById('modal-overlay');
        const revealBtn = document.getElementById('reveal-btn');
        const translationArea = document.getElementById('translation-area');
        const searchInput = document.getElementById('search-input');
        const searchDropdown = document.getElementById('search-dropdown');
        const paginationControls = document.getElementById('pagination-controls');

        // State
        let activeFilter = 'all'; 
        let currentData = studyWords;
        let currentPage = 1;
        const itemsPerPage = 12; // Adjust cards per page here
        let currentModalPhrase = null;

        // Filter Logic
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('active', 'bg-primary', 'text-white', 'border-primary');
                    b.classList.add('bg-white', 'text-gray-600', 'border-gray-300');
                });
                
                e.target.classList.remove('bg-white', 'text-gray-600', 'border-gray-300');
                e.target.classList.add('active', 'bg-primary', 'text-white', 'border-primary');

                activeFilter = e.target.dataset.filter;
                searchInput.value = ''; 
                applyFilters();
            });
        });

        function updateView(animate = true) {
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const slicedData = currentData.slice(start, end);

            renderGrid(slicedData);
            renderPagination();

            if (animate) {
                anime({
                    targets: '.flashcard',
                    scale: [0.95, 1],
                    opacity: [0, 1],
                    translateY: [10, 0],
                    delay: anime.stagger(30),
                    duration: 600,
                    easing: 'easeOutQuart'
                });
            }
        }

        function renderPagination() {
            paginationControls.innerHTML = '';
            const totalPages = Math.ceil(currentData.length / itemsPerPage);

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                
                btn.className = `w-8 h-8 rounded-md font-medium text-sm flex items-center justify-center transition-all ${
                    i === currentPage 
                    ? 'bg-primary text-white shadow-md' 
                    : 'bg-white text-gray-500 hover:bg-gray-100 border border-gray-200'
                }`;

                btn.addEventListener('click', () => {
                    currentPage = i;
                    updateView();
                    document.getElementById('phrase-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });

                paginationControls.appendChild(btn);
            }
        }

        function renderGrid(phrasesToRender) {
            grid.innerHTML = ''; 
            
            if (phrasesToRender.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-gray-400 font-sans mt-10 text-sm">No vocabulary found.</div>`;
                return;
            }

            phrasesToRender.forEach((phrase) => {
                const el = document.createElement('div');
                el.className = 'flashcard group';
                
                let categoryLabel = phrase.category === 'daily' ? 'Basics' : phrase.category;

                el.innerHTML = `
                    <div class="absolute top-3 left-3">
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider bg-gray-50 px-2 py-1 rounded">${categoryLabel}</span>
                    </div>

                    <div class="absolute top-3 right-3 z-20">
                        <button class="play-card-btn p-2 rounded-full play-btn">
                            <i data-lucide="volume-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                    
                    <span class="text-sm text-gray-400 font-jp mb-1">${phrase.kana}</span>
                    <h3 class="font-jp text-2xl md:text-3xl font-bold text-textMain group-hover:text-primary transition-colors">${phrase.jp}</h3>
                `;
                
                el.addEventListener('click', () => openModal(phrase));
                
                const playCardBtn = el.querySelector('.play-card-btn');
                playCardBtn.addEventListener('click', (e) => {
                    playJapaneseAudio(phrase.jp, e); // Reads the main text
                });

                grid.appendChild(el);
            });
            lucide.createIcons();
        }

        function applyFilters(query = '') {
            let filtered = studyWords;
            
            if (activeFilter !== 'all') {
                filtered = filtered.filter(p => p.category === activeFilter);
            }
            
            if (query.trim() !== '') {
                const q = query.toLowerCase().trim();
                filtered = filtered.filter(p => 
                    p.jp.includes(q) || 
                    p.kana.includes(q) || 
                    p.romaji.toLowerCase().includes(q) || 
                    p.en.toLowerCase().includes(q)
                );
            }
            
            currentData = filtered;
            currentPage = 1;
            updateView(query.trim() === '' || searchDropdown.classList.contains('hidden'));
        }

        // Search Events
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            searchDropdown.innerHTML = ''; 
            
            if (query.trim() === '') {
                searchDropdown.classList.add('hidden');
                applyFilters();
                return;
            }

            let matched = studyWords;
            if (activeFilter !== 'all') {
                matched = matched.filter(p => p.category === activeFilter);
            }
            matched = matched.filter(p => 
                p.jp.includes(query) || 
                p.kana.includes(query) || 
                p.romaji.toLowerCase().includes(query.toLowerCase()) || 
                p.en.toLowerCase().includes(query.toLowerCase())
            );

            if (matched.length > 0) {
                searchDropdown.classList.remove('hidden');
                matched.slice(0, 6).forEach(match => { 
                    const li = document.createElement('li');
                    li.className = 'px-4 py-3 hover:bg-gray-50 cursor-pointer border-b border-gray-100 flex justify-between items-center';
                    li.innerHTML = `
                        <div>
                            <span class="font-bold text-textMain text-sm mr-2">${match.jp}</span> 
                            <span class="text-xs text-gray-400">${match.kana}</span>
                        </div>
                        <span class="text-xs text-gray-500">${match.en}</span>
                    `;
                    
                    li.addEventListener('click', () => {
                        searchInput.value = match.jp;
                        searchDropdown.classList.add('hidden');
                        applyFilters(match.jp);
                    });
                    
                    searchDropdown.appendChild(li);
                });
            } else {
                searchDropdown.classList.add('hidden');
            }
        });

        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchDropdown.classList.add('hidden');
                applyFilters(searchInput.value);
                searchInput.blur();
            }
        });
        
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) {
                searchDropdown.classList.add('hidden');
            }
        });

        // Modal Logic
        function openModal(phrase) {
            currentModalPhrase = phrase;
            
            document.getElementById('modal-jp').innerText = phrase.jp;
            document.getElementById('modal-kana').innerText = phrase.kana;
            document.getElementById('modal-en').innerText = phrase.en;
            document.getElementById('modal-romaji').innerText = phrase.romaji;
            
            let catLabel = phrase.category === 'daily' ? 'Daily Basics' : 'JLPT ' + phrase.category;
            document.getElementById('modal-category').innerText = catLabel;
            
            const descEl = document.getElementById('modal-desc');
            if (phrase.desc) {
                descEl.innerText = phrase.desc;
                descEl.classList.remove('hidden');
                descEl.classList.add('block');
            } else {
                descEl.classList.add('hidden');
                descEl.classList.remove('block');
            }
            
            overlay.style.display = 'flex';
            translationArea.style.opacity = '0';
            revealBtn.style.display = 'inline-block';
            revealBtn.style.opacity = '1';

            anime({
                targets: '#modal-card',
                translateY: [40, 0],
                opacity: [0, 1],
                duration: 600,
                easing: 'easeOutElastic(1, 1)'
            });
        }

        document.getElementById('modal-play-btn').addEventListener('click', (e) => {
            if (currentModalPhrase) {
                playJapaneseAudio(currentModalPhrase.jp, e);
            }
        });

        revealBtn.addEventListener('click', () => {
            anime({
                targets: revealBtn,
                opacity: 0,
                scale: 0.95,
                duration: 300,
                complete: () => {
                    revealBtn.style.display = 'none';
                    anime({
                        targets: translationArea,
                        opacity: 1,
                        translateY: [10, 0],
                        duration: 500,
                        easing: 'easeOutQuart'
                    });
                }
            });
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            anime({
                targets: '#modal-card',
                translateY: 20,
                scale: 0.98,
                opacity: 0,
                duration: 250,
                easing: 'easeInQuart',
                complete: () => overlay.style.display = 'none'
            });
        });

        // Init
        window.addEventListener('load', () => {
            applyFilters();
        });
    </script>
</body>
</html>
